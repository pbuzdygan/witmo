version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Disable routine version bumps; Dependabot security updates still work.
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # Disable routine version bumps; Dependabot security updates still work.
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Disable routine version bumps; Dependabot security updates still work.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Disable routine version bumps; Dependabot security updates still work.
    open-pull-requests-limit: 0
