services:
  witmo:
    container_name: witmo_dev
    init: true
    restart: unless-stopped
    build:
      context: .
    environment:
      PORT: "4000"
      # Compose refuses to start until real secrets are supplied.
      OMDB_API_KEY: ${OMDB_API_KEY:?Set OMDB_API_KEY in the local .env file}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:?Set TMDB_READ_ACCESS_TOKEN in the local .env file}
      WATCH_REGION: ${WATCH_REGION:-PL}
    ports:
      - "8015:4000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
